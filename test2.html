<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body{font-family:sans-serif;padding:24px;background:#111;color:#eee;direction:rtl}
input{width:100%;padding:12px;border-radius:10px;border:1px solid #333;background:#222;color:#eee;font-size:14px;margin-bottom:10px;box-sizing:border-box}
button{width:100%;background:#7c6ef0;border:none;color:white;padding:12px;border-radius:10px;font-size:16px;cursor:pointer}
#log{margin-top:16px;background:#1a1a1a;border-radius:10px;padding:14px;font-size:13px;line-height:1.8;white-space:pre-wrap;word-break:break-all}
</style>
</head>
<body>
<h2>تست Gemini</h2>
<input type="text" id="key" placeholder="API key رو اینجا بذار..." />
<button onclick="test()">تست کن</button>
<div id="log">منتظر...</div>
<script>
async function test(){
  const key = document.getElementById('key').value.trim();
  const log = document.getElementById('log');
  if(!key){log.textContent='❌ key رو وارد کن';return;}
  log.textContent='در حال اتصال...\n';
  try{
    const url=`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${key}`;
    log.textContent+='URL ساخته شد\n';
    const r=await fetch(url,{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({contents:[{parts:[{text:'سلام'}]}]})
    });
    log.textContent+=`Status: ${r.status}\n`;
    const d=await r.json();
    log.textContent+=JSON.stringify(d,null,2);
  }catch(e){
    log.textContent+=`خطا: ${e.message}\n${e.stack||''}`;
  }
}
</script>
</body>
</html>
